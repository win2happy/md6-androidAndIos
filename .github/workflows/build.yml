name: Build MD6 App

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APK'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      build_ios:
        description: 'Build iOS IPA'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      release_type:
        description: 'Release type'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '24'
  JAVA_VERSION: '17'
  CAPACITOR_CLI_VERSION: '^6.0.0'

# ============================================================
# Android 构建 Job
# ============================================================
jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_android == 'true'

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 📦 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 📥 安装依赖
        run: npm install

      - name: 🔧 添加 Android 平台
        run: npx cap add android
        continue-on-error: true

      - name: 🔄 同步 Capacitor
        run: npx cap sync android

      - name: 🩹 应用 Android 原生补丁
        run: |
          chmod +x scripts/patch-android.sh
          bash scripts/patch-android.sh

      # ---- Debug 构建 ----
      - name: 🔨 构建 Android Debug APK
        if: github.event.inputs.release_type != 'release'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # ---- Release 构建（带签名）----
      - name: 🔑 解码 Android 签名密钥
        if: github.event.inputs.release_type == 'release'
        working-directory: android
        run: |
          # 从 secrets 解码 keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
          
          # 创建 local.properties 配置签名
          cat > app/keystore.properties << EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: 🔨 构建 Android Release APK
        if: github.event.inputs.release_type == 'release'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: 📤 上传 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: md6-android-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 📋 输出构建信息
        run: |
          echo "## 🤖 Android 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 构建类型 | ${{ github.event.inputs.release_type || 'debug' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js | ${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Java | ${{ env.JAVA_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Capacitor | ${{ env.CAPACITOR_CLI_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK 文件" >> $GITHUB_STEP_SUMMARY
          find android/app/build/outputs/apk -name "*.apk" -exec echo "- {}" \; >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "未找到 APK 文件" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # iOS 构建 Job
  # ============================================================
  build-ios:
    name: 🍎 Build iOS IPA
    runs-on: macos-14
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_ios == 'true'

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 设置 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15'

      - name: 📥 安装依赖
        run: npm install

      - name: 📦 安装 CocoaPods
        run: gem install cocoapods

      - name: 🔧 添加 iOS 平台
        run: npx cap add ios
        continue-on-error: true

      - name: 🔄 同步 Capacitor
        run: npx cap sync ios

      - name: 🩹 应用 iOS 原生补丁
        run: |
          chmod +x scripts/patch-ios.sh
          bash scripts/patch-ios.sh

      - name: 🔨 安装 iOS Pods
        working-directory: ios/App
        run: pod install

      # ---- Debug 构建 ----
      - name: 🔨 构建 iOS IPA (Debug)
        if: github.event.inputs.release_type != 'release'
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty

          # 创建 IPA（Debug 模式不需要签名）
          mkdir -p build/ipa/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa
          zip -r md6-debug.ipa Payload/
          cd ../..

      # ---- Release 构建（带签名）----
      - name: 🔨 构建 iOS IPA (Release)
        if: github.event.inputs.release_type == 'release'
        working-directory: ios/App
        run: |
          # Release 构建需要签名证书和配置文件
          # 解码证书
          echo "${{ secrets.IOS_P12_BASE64 }}" | base64 --decode > /tmp/certificate.p12

          # 导入证书到钥匙串
          security create-keychain -p actions temp.keychain
          security import /tmp/certificate.p12 -t agg -k temp.keychain -P "${{ secrets.IOS_P12_PASSWORD }}" -A
          security list-keychains -s temp.keychain
          security unlock-keychain -p actions temp.keychain

          # 设置配置文件
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISION_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="profile" \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            | xcpretty

          # 导出 IPA
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa \
            | xcpretty

          # 清理
          security delete-keychain temp.keychain
          rm -f /tmp/certificate.p12

      - name: 📤 上传 iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: md6-ios-ipa
          path: |
            ios/App/build/ipa/*.ipa
          retention-days: 30

      - name: 📋 输出构建信息
        run: |
          echo "## 🍎 iOS 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 构建类型 | ${{ github.event.inputs.release_type || 'debug' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js | ${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Xcode | 15 |" >> $GITHUB_STEP_SUMMARY
          echo "| Capacitor | ${{ env.CAPACITOR_CLI_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### IPA 文件" >> $GITHUB_STEP_SUMMARY
          find ios/App/build/ipa -name "*.ipa" -exec echo "- {}" \; >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "未找到 IPA 文件" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Release 发布 Job
  # ============================================================
  release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    # 仅在 push 到 main/master 时自动发布，PR 不发布
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📅 生成版本号
        id: version
        run: |
          # 版本号格式: v1.0.0-20240101 或 v1.0.0-20240101-abc1234
          DATE=$(date +'%Y%m%d')
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TYPE="${{ github.event.inputs.release_type || 'debug' }}"
          
          if [ "$BUILD_TYPE" = "release" ]; then
            VERSION="v1.0.0-${DATE}"
          else
            VERSION="v1.0.0-dev.${DATE}-${SHORT_SHA}"
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT
          echo "📌 版本号: ${VERSION}"

      - name: 📥 下载 Android APK
        uses: actions/download-artifact@v4
        with:
          name: md6-android-apk
          path: release/android
        continue-on-error: true

      - name: 📥 下载 iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: md6-ios-ipa
          path: release/ios
        continue-on-error: true

      - name: 📁 整理发布文件
        run: |
          mkdir -p release/upload
          
          # 重命名 APK 文件，添加版本号
          if [ -d "release/android" ]; then
            for apk in release/android/*.apk; do
              if [ -f "$apk" ]; then
                base=$(basename "$apk" .apk)
                cp "$apk" "release/upload/MD6-${base}-${{ steps.version.outputs.version }}.apk"
              fi
            done
          fi
          
          # 重命名 IPA 文件，添加版本号
          if [ -d "release/ios" ]; then
            for ipa in release/ios/*.ipa; do
              if [ -f "$ipa" ]; then
                base=$(basename "$ipa" .ipa)
                cp "$ipa" "release/upload/MD6-${base}-${{ steps.version.outputs.version }}.ipa"
              fi
            done
          fi
          
          # 列出将要上传的文件
          echo "📦 发布文件列表:"
          ls -la release/upload/ 2>/dev/null || echo "没有文件可发布"

      - name: 🚀 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "MD6 ${{ steps.version.outputs.version }}"
          body: |
            ## MD6 App ${{ steps.version.outputs.version }}
            
            **构建类型**: ${{ steps.version.outputs.build_type }}
            **构建日期**: ${{ steps.version.outputs.date }}
            **提交**: ${{ steps.version.outputs.sha }}
            
            ### 📱 下载
            
            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Android | `.apk` 文件 | 直接安装到 Android 设备 |
            | iOS | `.ipa` 文件 | 需通过 AltStore 等工具侧载安装 |
            
            ### ⚡ 更新内容
            
            - FSAccess 原生插件：使用 SAF/UIDocumentPicker 实现真正的文件选择器
            - 运行时权限请求：存储权限 + 通知权限
            - showDirectoryPicker 现在会弹出系统目录选择器
            - showOpenFilePicker 现在会弹出系统文件选择器
            - showSaveFilePicker 现在会弹出系统保存对话框
            
            > 💡 Android 首次安装后，请在设置中授予存储和通知权限。
          draft: false
          prerelease: ${{ steps.version.outputs.build_type == 'debug' }}
          files: release/upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 输出发布信息
        run: |
          echo "## 🚀 Release 发布结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 版本号 | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 构建类型 | ${{ steps.version.outputs.build_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 标签 | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 发布文件" >> $GITHUB_STEP_SUMMARY
          ls release/upload/ 2>/dev/null | while read f; do echo "- $f" >> $GITHUB_STEP_SUMMARY; done || echo "无文件" >> $GITHUB_STEP_SUMMARY